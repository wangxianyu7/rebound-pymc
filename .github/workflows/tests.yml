name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "pymc>=5" "pytensor>=2.20" "rebound>=4" reboundx "exoplanet>=0.6" exoplanet-core "numpy<2" pytest
          python -m pip install -e . --no-build-isolation --no-deps

      - name: Get compiledir
        id: compiledir
        run: |
          echo "compiledir=$(python -c 'import pytensor; print(pytensor.config.compiledir)')" >> "$GITHUB_OUTPUT"

      - name: Cache compiledir
        uses: actions/cache@v4
        with:
          path: ${{ steps.compiledir.outputs.compiledir }}
          key: compiledir-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            compiledir-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run tests
        run: python -m pytest -v tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist .
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*
